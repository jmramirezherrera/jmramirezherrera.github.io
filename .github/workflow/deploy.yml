name: Deploy Vite app to Vercel

on:
	push:
		branches: [main]
	pull_request:

concurrency:
	group: vercel-${{ github.ref }}
	cancel-in-progress: true

jobs:
	deploy:
		runs-on: ubuntu-latest
		steps:
			- name: Check out repository
				uses: actions/checkout@v4

			- name: Set up Node.js
				uses: actions/setup-node@v4
				with:
					node-version: 20
					cache: npm

			- name: Install dependencies
				run: npm ci

			- name: Install Vercel CLI
				run: npm install --global vercel

			- name: Pull Vercel project settings
				run: vercel pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token="$VERCEL_TOKEN"
				env:
					VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
					VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
					VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

			- name: Build Vite app
				run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN"
				env:
					VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
					VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
					VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

			- name: Deploy to Vercel
				run: vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token="$VERCEL_TOKEN"
				env:
					VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
					VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
					VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
